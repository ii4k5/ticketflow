events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
 
  upstream user_service   { server user-service:3001; }
  upstream ticket_service { server ticket-service:3002; }
  upstream notif_service  { server notification-service:3003; }
 
  server {
    listen 80;
 
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
 
    location ~ ^/api/(users|auth) {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      add_header Access-Control-Allow-Origin  $http_origin always;
      add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type,Authorization' always;
      add_header Access-Control-Allow-Credentials true always;
      if ($request_method = OPTIONS) { return 204; }
    }
 
    location ~ ^/api/(events|tickets) {
      proxy_pass http://ticket_service;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type,Authorization' always;
      if ($request_method = OPTIONS) { return 204; }
    }
 
    location /api/notifications {
      proxy_pass http://notif_service;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods 'GET,PATCH,OPTIONS' always;
      add_header Access-Control-Allow-Headers 'Content-Type,Authorization' always;
      if ($request_method = OPTIONS) { return 204; }
    }
  }
}